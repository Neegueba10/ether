name: PR image build

# Runs untrusted PR code: read-only token, uses no secrets and no registry
# credentials. The only output is an OCI archive, which Publish PR image
# treats as data.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-image-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PR preview image
    # Saves runner time only; this file comes from the PR, so it is not a
    # security check. The publisher re-checks the live PR and author.
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Stage ffmpeg
        run: |
          scripts/fetch-ffmpeg.sh linux-amd64
      - name: Build image without registry credentials
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg "VERSION=pr-${PR_NUMBER}" --build-arg "COMMIT=${HEAD_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=pr-${PR_NUMBER}" \
            --label "org.opencontainers.image.description=Unreviewed preview of Ether PR #${PR_NUMBER}" \
            --output type=oci,dest=pr-image.tar .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-image
          path: pr-image.tar
          retention-days: 1
          compression-level: 0
